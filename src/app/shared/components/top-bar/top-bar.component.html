<header class="flex flex-wrap items-center gap-4 px-5 py-6 lg:px-6">
  <button type="button" (click)="menuToggle.emit()" [attr.aria-expanded]="menuOpen" aria-controls="primary-navigation" aria-label="Toggle navigation" class="rounded-lg border border-slate-200 p-3 lg:hidden dark:border-slate-700"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="relative min-w-[200px] flex-1 basis-64">
    <svg class="pointer-events-none absolute left-4 top-3.5 h-5 w-5 text-[#7b91b2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
    <input type="search" aria-label="Search by callsign" placeholder="Search by callsign (e.g. AI101)" [(ngModel)]="search" class="h-12 w-full rounded-lg border border-[#dce5f1] bg-white pl-12 pr-4 text-sm shadow-sm outline-none placeholder:text-[#7b8da8] focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900"/>
  </div>
  <div class="grid w-full grid-cols-1 gap-4 sm:grid-cols-3 lg:w-auto lg:min-w-[480px] lg:flex-[1.5]">
    <select aria-label="Flight status" [(ngModel)]="status" class="h-12 min-w-0 rounded-lg border border-[#dce5f1] bg-white px-4 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900"><option value="">All Status</option><option *ngFor="let item of statuses" [value]="item">{{ item }}</option></select>
    <select aria-label="Origin airport" [(ngModel)]="origin" class="h-12 min-w-0 rounded-lg border border-[#dce5f1] bg-white px-4 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900"><option value="">All Origins</option><option *ngFor="let airport of airports" [value]="airport">{{ airport }}</option></select>
    <select aria-label="Destination airport" [(ngModel)]="destination" class="h-12 min-w-0 rounded-lg border border-[#dce5f1] bg-white px-4 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 dark:border-slate-700 dark:bg-slate-900"><option value="">All Destinations</option><option *ngFor="let airport of airports" [value]="airport">{{ airport }}</option></select>
  </div>
  <div class="ml-auto flex items-center gap-4 lg:pl-5">
    <button type="button" (click)="themeToggle.emit()" [attr.aria-label]="darkMode ? 'Use light theme' : 'Use dark theme'" [attr.aria-pressed]="darkMode" class="rounded-full p-2 text-[#587299] hover:bg-slate-200 focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-slate-300 dark:hover:bg-slate-800"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 15A9 9 0 0 1 9 3.5 9 9 0 1 0 20.5 15Z"/></svg></button>
    <div class="relative border-l border-[#e0e7f1] pl-5 dark:border-slate-700" (keydown.escape)="profileOpen = false">
      <button type="button" (click)="profileOpen = !profileOpen" [attr.aria-expanded]="profileOpen" aria-label="User profile" class="flex items-center gap-3 rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-[#416bc6] text-sm font-medium text-white ring-2 ring-inset ring-white/15">BK</span><svg class="h-4 w-4 text-[#45648f]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div *ngIf="profileOpen" class="absolute right-0 top-14 z-20 w-48 rounded-xl border border-slate-200 bg-white p-4 shadow-lg dark:border-slate-700 dark:bg-slate-900"><p class="text-sm font-semibold">BK</p><p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Demo profile</p></div>
    </div>
  </div>
</header>
