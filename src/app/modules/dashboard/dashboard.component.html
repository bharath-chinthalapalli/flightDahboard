<div [class.dark]="darkMode">
  <div class="min-h-screen bg-[#f6f9fd] font-sans text-[#20365b] dark:bg-slate-950 dark:text-slate-200">
    <button *ngIf="sidebar" type="button" aria-label="Close navigation" class="fixed inset-0 z-30 bg-slate-950/50 lg:hidden" (click)="sidebar = false"></button>
    <aside id="primary-navigation" class="fixed inset-y-0 left-0 z-40 flex w-[280px] flex-col overflow-y-auto bg-gradient-to-br from-[#1b304f] to-[#111d37] px-[18px] text-[#c7d4e9] transition-transform duration-200 lg:translate-x-0" [ngClass]="sidebar ? 'translate-x-0' : '-translate-x-full'">
      <a routerLink="/dashboard/mainDashboard" (click)="selectModule(allModules[0])" class="flex items-start gap-4 px-2 pb-10 pt-8">
        <svg class="h-10 w-10 shrink-0 text-[#2587f5]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m21.5 2.5-1.2-.3-7.4 5.6L4 5.5 2 7l7 4-4 4-3-.5-1 1 4 3 3 4 1-1-.5-3 4-4 4 7 1.5-2-2.3-8.9 5.6-7.4z"/></svg>
        <span><span class="block text-[26px] font-semibold leading-8 tracking-tight text-white">SkyTrack</span><span class="mt-1 block text-xs">Flight Tracking &amp; Operations</span></span>
      </a>
      <nav aria-label="Main navigation" class="space-y-1">
        <button *ngFor="let menuItem of allModules" type="button" (click)="selectModule(menuItem)" [attr.aria-current]="menuItem.selected ? 'page' : null" class="flex w-full items-center gap-5 rounded-lg px-4 py-4 text-left text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-300" [ngClass]="menuItem.selected ? 'bg-[#2461ce] text-white shadow-sm ring-1 ring-inset ring-blue-400/30' : 'hover:bg-white/10 hover:text-white'">
          <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="menuItem.icon"/></svg>{{ menuItem.name }}
        </button>
      </nav>
      <div class="mt-auto px-4 pb-7 pt-12">
        <div class="flex items-center gap-3" title="Sample weather">
          <svg class="h-11 w-11 text-sky-300" viewBox="0 0 48 48" fill="none" stroke-width="2.5" aria-hidden="true"><g stroke="#fbbf24"><circle cx="31" cy="15" r="7"/><path d="M31 3V0 M43 15h4 M40 6l3-3 M22 6l-3-3"/></g><path stroke="currentColor" fill="#1b304f" d="M12 38a9 9 0 0 1-1-18 12 12 0 0 1 23-1 10 10 0 0 1 1 19Z"/></svg>
          <div><p class="text-lg font-semibold text-white">28°C</p><p class="text-xs">Partly Cloudy <span class="text-[10px] text-slate-400">· Demo</span></p></div>
        </div>
        <div class="mt-12 space-y-1 text-xs leading-5"><p>UTC &nbsp; {{ today | date:'HH:mm':'UTC' }}</p><p>{{ today | date:'EEE, dd MMM yyyy':'UTC' }}</p></div>
      </div>
    </aside>
    <div class="min-h-screen lg:ml-[280px]">
      <app-top-bar [darkMode]="darkMode" [menuOpen]="sidebar" (menuToggle)="sidebar = !sidebar" (themeToggle)="darkMode = !darkMode"></app-top-bar>
      <main aria-label="Dashboard content" class="min-h-[calc(100vh-100px)] p-6"><router-outlet></router-outlet></main>
    </div>
  </div>
</div>
